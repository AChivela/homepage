
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos | Portefólio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">PORTFÓLIO</a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre mim</a></li>
                        <li class="nav-item"><a class="nav-link" href="projetos.html">Projetos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contactos.html">Contactos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <section class="text-center mb-5">
            <h1 class="section-title">Contacta-me</h1>
            <p class="section-description">
                Tens alguma questão ou proposta? Envia uma mensagem.
            </p>
        </section>

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow contact-card">
                    <div class="card-body p-4">

                        <form id="contactForm">

                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input type="text" class="form-control"
                                       id="nome" placeholder="O teu nome" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control"
                                       id="email" placeholder="exemplo@email.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="assunto" class="form-label">Assunto</label>
                                <input type="text" class="form-control"
                                       id="assunto" placeholder="Assunto da mensagem" required>
                            </div>

                            <div class="mb-3">
                                <label for="mensagem" class="form-label">Mensagem</label>
                                <textarea class="form-control" id="mensagem"
                                          rows="5" placeholder="Escreve a tua mensagem..."
                                          required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Enviar mensagem
                            </button>

                            <div id="formMessage" class="mt-3" role="status"></div>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </main>

    <footer class="footer text-center">
        <p>&copy; <span id="currentYear"></span> O Meu Portefólio.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
