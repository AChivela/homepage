<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Envia-me uma mensagem.">
  <title>Contactos | O Teu Nome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

  <!-- CSS próprio (depois do Bootstrap, para poder sobrepor estilos) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

  <header class="site-header">
    <nav class="navbar container" aria-label="Navegação principal">
      <a class="brand" href="index.html">O Teu Nome</a>
      <ul class="nav menu">
        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
        <li class="nav-item"><a class="nav-link" href="projetos.html">Projetos</a></li>
        <li class="nav-item"><a class="nav-link active" href="contactos.html" aria-current="page">Contactos</a></li>
      </ul>
      <button id="theme-toggle" class="btn btn-sm btn-outline-secondary" type="button" aria-pressed="false">Modo escuro</button>
    </nav>
  </header>

  <main id="conteudo">

    <section class="secao">
      <div class="container contacto">
        <h1>Contactos</h1>
        <p>Preenche o formulário e eu respondo assim que puder.</p>

        <div id="aviso" class="alert d-none" role="alert"></div>

        <form id="form-contacto" novalidate>
          <div class="mb-3">
            <label class="form-label" for="nome">Nome</label>
            <input class="form-control" type="text" id="nome" name="nome" autocomplete="name">
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="mensagem">Mensagem</label>
            <textarea class="form-control" id="mensagem" name="mensagem" rows="5"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Enviar mensagem</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <p class="mb-0">&copy; 2026 O Teu Nome. Feito com HTML, Bootstrap, CSS e JavaScript.</p>
      <p class="mb-0">Programação .NET</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
